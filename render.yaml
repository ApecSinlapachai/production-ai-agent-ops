services:
  - type: web
    name: production-ai-agent-ops-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTH_MODE
        value: demo_sandbox
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_COMPLEX_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: RATE_LIMIT_PER_DAY
        value: "60"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: RETRY_BASE_DELAY_SECONDS
        value: "1.0"
      - key: HITL_CONFIDENCE_THRESHOLD
        value: "0.80"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

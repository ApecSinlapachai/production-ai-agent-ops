name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Lint, Pytest (PG16 + Eval Gates), Benchmark & Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/pyproject.toml"

      - name: Install API and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./api[dev]"

      - name: Run Ruff lint checks
        working-directory: api
        run: ruff check app ../tests ../eval

      - name: Run unit, live PostgreSQL 16 integration, and eval gate tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ops
        run: pytest -v

      - name: Run Tiered Model Routing & Safety benchmark gate
        run: python eval/run_benchmark.py

      - name: Validate Docker Compose and build API image
        run: |
          docker compose config -q
          docker build -t agent-ops-api:ci ./api

  frontend-ci:
    name: Next.js Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript typecheck and Next.js build
        working-directory: web
        run: |
          npx tsc --noEmit
          npm run build
